<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Hub · ICS Monitoring &amp; Field Work Minute</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#256b30" id="themeColor">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bar:#ffffff;--ink:#16221a;--muted:#6a776e;--line:#d9e0d6;--ics:#256b30;--fld:#2f6f6a;--icsbg:#e4f1e5;--fldbg:#dcefed}
@media (prefers-color-scheme:dark){:root{--bar:#151c17;--ink:#eaf1ec;--muted:#93a198;--line:#2b372f;--ics:#6fcf7e;--fld:#6cc2ba;--icsbg:#1c3322;--fldbg:#1a3532}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bar);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Khmer",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.stage{flex:1;min-height:0;position:relative;background:var(--bar)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bar)}
.stage iframe.on{display:block}
nav{flex:none;display:grid;grid-template-columns:1fr 1fr;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{font:inherit;border:0;background:none;color:var(--muted);padding:8px 6px 7px;display:grid;justify-items:center;gap:1px;cursor:pointer;border-top:3px solid transparent;min-height:58px}
nav button .ic{font-size:21px;line-height:1.1}
nav button b{font-size:14px;font-weight:700}
nav button small{font-size:11.5px;opacity:.85}
nav button.on{color:var(--c);border-top-color:var(--c)}
nav button[data-app=ics]{--c:var(--ics)}
nav button[data-app=fld]{--c:var(--fld)}
nav button[data-app=ics].on{background:var(--icsbg)}
nav button[data-app=fld].on{background:var(--fldbg)}
nav button:focus-visible{outline:3px solid var(--c);outline-offset:-3px}
</style>
</head>
<body>
<div class="stage">
  <iframe id="fr-ics" title="ICS Monitoring" allow="geolocation"></iframe>
  <iframe id="fr-fld" title="Field Work Minute" allow="geolocation"></iframe>
</div>
<nav aria-label="Menu">
  <button type="button" data-app="ics" aria-label="ICS Monitoring"><span class="ic">🌱</span><b>ICS Monitoring</b><small>ត្រួតពិនិត្យ ICS</small></button>
  <button type="button" data-app="fld" aria-label="Field Work Minute"><span class="ic">📝</span><b>Field Work Minute</b><small>កំណត់ហេតុចុះ Field</small></button>
</nav>
<script>
(function () {
  var SRC = { ics: 'ics.html', fld: 'field.html' };
  var TITLE = { ics: 'ICS Monitoring', fld: 'Field Work Minute' };
  var COLOR = { ics: '#256b30', fld: '#2f6f6a' };
  var KEY = 'hub_last';
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function put(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function show(app) {
    if (!SRC[app]) app = 'ics';
    Object.keys(SRC).forEach(function (k) {
      var fr = document.getElementById('fr-' + k), on = k === app;
      if (on && !fr.getAttribute('src')) fr.setAttribute('src', SRC[k]);     // load an app the first time it is opened
      fr.classList.toggle('on', on);
    });
    document.querySelectorAll('nav button').forEach(function (b) {
      var on = b.getAttribute('data-app') === app;
      b.classList.toggle('on', on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
    document.title = TITLE[app];
    document.getElementById('themeColor').setAttribute('content', COLOR[app]);
    put(app);
    try { history.replaceState(null, '', '#' + app); } catch (e) {}
  }
  document.querySelectorAll('nav button').forEach(function (b) {
    b.onclick = function () { show(b.getAttribute('data-app')); };
  });
  var h = (location.hash || '').replace('#', '');
  show(SRC[h] ? h : (SRC[get()] ? get() : 'ics'));
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
