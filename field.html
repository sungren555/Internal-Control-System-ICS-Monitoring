<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>កំណត់ហេតុសកម្មភាពចុះ Field</title>
<meta name="theme-color" content="#2b4a2f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("fl_theme");if(t!=="dark"&&t!=="light"){var i=JSON.parse(localStorage.getItem("ics_theme")||"null");t=(i==="dark"||i==="light")?i:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{color-scheme:light;--bg:#f3f5ee;--surface:#fff;--ink:#1d2a1f;--muted:#5d6b5f;--line:#d5dccd;--rice:#b8860b;--rice-bg:#f6ecc9;--ce:#2f6f6a;--ce-bg:#d7ece9;--btn:#2b4a2f;--btnink:#fff;--err:#a33;--ok:#2b6b34}
:root[data-theme="dark"]{--bg:#141a15;--surface:#1e271f;--ink:#e8eee5;--muted:#9fad9f;--line:#334034;--rice:#e3b94a;--rice-bg:#3a3217;--ce:#6cc2ba;--ce-bg:#1d3a37;--btn:#9bd09f;--btnink:#10200f;--err:#f08a8a;--ok:#8fd49a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer",system-ui,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--ce);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{margin:0;border:2px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.seg input:checked+label.r{background:var(--rice-bg);border-color:var(--rice)}
.seg input:checked+label.c{background:var(--ce-bg);border-color:var(--ce)}
.seg input:focus-visible+label{outline:3px solid var(--ce)}
.btn{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.6em;font-size:.92rem}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.setup{background:var(--rice-bg);border:1px solid var(--rice);border-radius:12px;padding:12px;margin-bottom:16px;display:grid;gap:8px}
.setup[hidden]{display:none}
h2{font-size:1.1rem;margin:28px 0 8px}
.log{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:8px 12px;margin-bottom:8px}
.log.r{border-left-color:var(--rice)}.log.c{border-left-color:var(--ce)}
.log .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.log .meta{color:var(--muted);font-size:.88rem}
.empty{color:var(--muted);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.tabs button{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px;cursor:pointer}
.tabs button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details details{margin:6px 8px;background:var(--bg)}
summary{cursor:pointer;padding:9px 12px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
summary span.n{color:var(--muted);font-weight:400;white-space:nowrap;font-size:.88rem}
.tw{overflow-x:auto;padding:0 8px 8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.grand{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.grand div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grand b{display:block;font-size:1.3rem;line-height:1.3}.grand span{color:var(--muted);font-size:.85rem}
.btn2{font:inherit;font-weight:700;background:var(--surface);color:var(--ink);border:2px solid var(--btn);border-radius:10px;padding:10px 16px;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.draft{background:var(--surface);border:1px dashed var(--rice);border-left:6px solid var(--rice);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.draft .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.draft .meta{color:var(--muted);font-size:.88rem}
.draft .act{display:flex;gap:8px;margin-top:6px}
.draft .act button{font:inherit;font-size:.88rem;font-weight:600;border-radius:8px;padding:4px 12px;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.editing{background:var(--rice-bg);border:1px solid var(--rice);border-radius:10px;padding:6px 10px;font-size:.9rem}
.editing[hidden]{display:none}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:8px 0 4px}
.bd h3{font-size:.98rem;margin:0 0 4px;padding:0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ibtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:44px;height:44px;font-size:20px;cursor:pointer}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top"><h1>កំណត់ហេតុសកម្មភាពចុះ Field</h1><button type="button" class="ibtn" id="theme" aria-label="Dark / Light mode"></button></div>
<p class="sub">ទិន្នន័យបុគ្គលិក និងសកម្មភាពទាញពី Google Sheet ហើយកំណត់ហេតុរក្សាទុកតាមផ្ទាំងខែ។</p>

<div class="tabs">
  <button type="button" id="tLog" class="on">បញ្ចូលកំណត់ហេតុ</button>
  <button type="button" id="tSum">របាយការណ៍សង្ខេប</button>
</div>

<div class="setup" id="setup" hidden>
  <b>ភ្ជាប់ជាមួយ Apps Script</b>
  <span>បិទភ្ជាប់ Web app URL (បញ្ចប់ដោយ /exec)</span>
  <input id="apiIn" placeholder="https://script.google.com/macros/s/.../exec">
  <button class="btn" type="button" id="apiSave">រក្សាទុក URL</button>
</div>

<div id="viewLog">
<form id="f" novalidate>
  <div>
    <div style="font-weight:600;font-size:.92rem;margin-bottom:4px">អង្គភាព</div>
    <div class="seg">
      <div><input type="radio" name="org" id="o1" value="RP" checked><label for="o1" class="r">RP</label></div>
      <div><input type="radio" name="org" id="o2" value="IRCC"><label for="o2" class="c">IRCC</label></div>
    </div>
  </div>
  <label>ឈ្មោះបុគ្គលិក<select id="staff" required></select></label>
  <div id="secInfo" class="sub" style="margin:-6px 0 0"></div>
  <div>
    <div style="font-weight:600;font-size:.92rem;margin-bottom:4px">គម្រោង</div>
    <div class="seg">
      <div><input type="radio" name="proj" id="p1" value="IBIS Rice" checked><label for="p1" class="r">IBIS Rice</label></div>
      <div><input type="radio" name="proj" id="p2" value="CE"><label for="p2" class="c">CE (Community Engagement)</label></div>
    </div>
  </div>
  <label>ប្រភេទ (Category)<select id="cat" required></select></label>
  <label>សកម្មភាព<select id="act" required></select></label>
  <label>កាលបរិច្ឆេទ<input type="date" id="date" required></label>
  <div class="row">
    <label>IRPG<select id="irpg"></select></label>
    <label>ភូមិ<select id="vil"></select></label>
  </div>
  <input id="loc" placeholder="បញ្ចូលឈ្មោះទីតាំង (ភូមិ / ឃុំ / ស្រុក)" hidden>
  <div class="row">
    <label>អ្នកចូលរួមសរុប (នាក់)<input type="number" id="tot" min="0" inputmode="numeric" placeholder="មិនបង្ខំ"></label>
    <label>ក្នុងនោះស្ត្រី (នាក់)<input type="number" id="wom" min="0" inputmode="numeric" placeholder="មិនបង្ខំ"></label>
  </div>
  <label>កំណត់ត្រា / លទ្ធផល<textarea id="note" rows="3"></textarea></label>
  <label>⚠️ បញ្ហាដែលជួបប្រទះ<textarea id="prob" rows="3" placeholder="មិនបង្ខំ"></textarea></label>
  <label>✅ ដំណោះស្រាយ / ជំហានបន្ទាប់<textarea id="sol" rows="3" placeholder="មិនបង្ខំ"></textarea></label>
  <div class="msg" id="msg" role="status"></div>
  <div class="editing" id="editBar" hidden></div>
  <div class="btns">
    <button class="btn2" type="button" id="saveDraft">Save ទុកសិន</button>
    <button class="btn" type="submit" id="go">Submit</button>
  </div>
</form>

<div id="draftWrap" hidden>
  <h2>សេចក្ដីព្រាងដែលបាន Save (មិនទាន់ Submit)</h2>
  <div id="drafts"></div>
</div>

<h2>កំណត់ហេតុខែនេះរបស់ខ្ញុំ</h2>
<div id="mine"></div>
</div>

<div id="viewSum" hidden>
  <div class="row" style="margin-bottom:12px">
    <label>ខែ<select id="sm"><option value="">ខែទាំងអស់</option></select></label>
    <label>ផ្នែក (Section)<select id="ss"><option value="">ទាំងអស់</option></select></label>
  </div>
  <div class="row" style="margin-bottom:12px">
    <label>Category<select id="sc"><option value="">ទាំងអស់</option></select></label>
    <label>សកម្មភាព (Activity)<select id="sa"><option value="">ទាំងអស់</option></select></label>
  </div>
  <div class="row" style="margin-bottom:12px">
    <label>IRPG<select id="si"><option value="">ទាំងអស់</option></select></label>
  </div>
  <div id="sumOut"></div>
</div>
</main>

<script>
// https://script.google.com/macros/s/AKfycbxmceczGxDx8RLZsGSPOhwtfP3HnQtRNOynUcdRkq1qdvl2KgB6i0Ui3nIvZh-u5cyJ/exec
var API_URL = "https://script.google.com/macros/s/AKfycbxmceczGxDx8RLZsGSPOhwtfP3HnQtRNOynUcdRkq1qdvl2KgB6i0Ui3nIvZh-u5cyJ/exec";

var $ = function(i){return document.getElementById(i)};
var cfg = null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function api(){return API_URL||ls("fl_api")||""}
function say(t,c){var m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
function proj(){return document.querySelector('input[name=proj]:checked').value}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}

function loadConfig(){
  if(!api()){$("setup").hidden=false;say("សូមភ្ជាប់ URL របស់ Apps Script ជាមុន។","err");return}
  var cached=ls("fl_cfg");
  if(cached){try{cfg=JSON.parse(cached);fillStaff()}catch(e){}}
  fetch(api()+"?action=config").then(function(r){return r.json()}).then(function(d){
    if(!d.ok)throw new Error(d.error);
    cfg=d;ls("fl_cfg",JSON.stringify(d));fillStaff();say("");
  }).catch(function(e){if(!cfg)say("មិនអាចទាញទិន្នន័យពី Sheet បានទេ៖ "+e.message,"err")});
}

/* ===== អង្គភាព RP / IRCC ===== */
// If the Apps Script sends s.org ("RP" / "IRCC") that is used. Otherwise this list (from the Staff/Work sheet) decides; unknown names are shown under both.
var ORG_FALLBACK={RP:["SUNG REN","SAN TEAP","PHOUMA","THORN","DARA","SOTHY","EM CHANTHEA","VIENG TOET"],IRCC:["KALAYAN","KIMLY","SAMATH","VONGRITH","SREYPOV","SOPHEA"]};
function orgOf(s){
  var o=String(s.org||s.group||s.organization||s.organisation||"").toUpperCase();
  if(o.indexOf("IRCC")>-1)return "IRCC";
  if(/\bRP\b/.test(o))return "RP";
  var n=String(s.name||"").toUpperCase().replace(/\s+/g," ").trim(),r="";
  Object.keys(ORG_FALLBACK).forEach(function(k){ORG_FALLBACK[k].forEach(function(p){if(n.indexOf(p)===0)r=k})});
  return r;
}
function curOrg(){return document.querySelector("input[name=org]:checked").value}
function setOrg(o){var r=document.querySelector("input[name=org][value="+o+"]");if(r)r.checked=true}
function fillStaff(){
  var keep=ls("fl_staff")||$("staff").value;
  var ks=cfg.staff.filter(function(x){return x.name===keep})[0],ko=ks?orgOf(ks):"",so=ls("fl_org");
  if(ko)setOrg(ko);else if(so==="RP"||so==="IRCC")setOrg(so);
  renderStaff(keep);
}
function renderStaff(keep){
  var o=curOrg(),list=cfg.staff.filter(function(s){var g=orgOf(s);return !g||g===o});
  $("staff").innerHTML='<option value="">ជ្រើសរើសឈ្មោះ</option>'+list.map(function(s){return '<option>'+esc(s.name)+'</option>'}).join("");
  $("staff").value=(keep&&list.some(function(x){return x.name===keep}))?keep:"";
  onStaff(true);
}
function onStaff(initial){
  var s=cfg.staff.filter(function(x){return x.name===$("staff").value})[0];
  $("secInfo").textContent=s&&s.section?"ផ្នែក៖ "+s.section:"";
  if(s&&!initial||s&&initial&&!ls("fl_proj")){
    var sec=s.section.toLowerCase();
    if(sec.indexOf("ibis")>-1)$("p1").checked=true;
    else if(sec.indexOf("community")>-1||sec.indexOf("ce")>-1)$("p2").checked=true;
  }
  if(s)ls("fl_staff",s.name);
  fillCats();loadMine();
}
function fillCats(){
  var cats=(cfg.activities[proj()]||[]);
  $("cat").innerHTML='<option value="">ជ្រើសរើស Category</option>'+cats.map(function(c,i){return '<option value="'+i+'">'+esc(c.category)+'</option>'}).join("");
  fillActs();
}
function fillActs(){
  var c=(cfg.activities[proj()]||[])[$("cat").value];
  $("act").innerHTML='<option value="">ជ្រើសរើសសកម្មភាព</option>'+(c?c.items.map(function(a){return '<option>'+esc(a)+'</option>'}).join(""):"");
}
function loadMine(){
  var n=$("staff").value;
  if(!n||!api()){$("mine").innerHTML='<div class="empty">ជ្រើសរើសឈ្មោះដើម្បីមើលកំណត់ហេតុ។</div>';return}
  fetch(api()+"?action=logs&staff="+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(d){
    if(!d.ok)throw new Error(d.error);
    $("mine").innerHTML=d.logs.length?d.logs.map(function(l){
      return '<div class="log '+(l.project==="CE"?"c":"r")+'"><div class="top"><span>'+esc(l.activity)+'</span><span>'+(l.total?esc(l.total)+' នាក់'+(l.women?' (ស្ត្រី '+esc(l.women)+')':''):'')+'</span></div><div class="meta">'+esc(l.date)+' · '+esc(l.project)+' · '+esc(l.location)+'</div></div>'}).join("")
      :'<div class="empty">មិនទាន់មានកំណត់ហេតុក្នុងខែនេះទេ។</div>';
  }).catch(function(){$("mine").innerHTML='<div class="empty">មិនអាចទាញកំណត់ហេតុបានទេ។</div>'});
}

$("apiSave").onclick=function(){var v=$("apiIn").value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(v)){say("URL មិនត្រឹមត្រូវ។ ត្រូវបញ្ចប់ដោយ /exec","err");return}ls("fl_api",v);$("setup").hidden=true;say("");loadConfig()};
$("staff").onchange=function(){onStaff(false)};
document.querySelectorAll("input[name=org]").forEach(function(x){x.onchange=function(){ls("fl_org",curOrg());ls("fl_staff","");if(cfg)renderStaff(null)}});
document.querySelectorAll('input[name=proj]').forEach(function(x){x.onchange=function(){ls("fl_proj","1");fillCats()}});
$("cat").onchange=fillActs;

function validate(p){
  var c=(cfg&&cfg.activities[p.project]||[]).filter(function(x){return x.category===p.category})[0];
  if(!p.staff||!p.date||!c||!p.activity||!p.location)return "សូមបំពេញ ឈ្មោះ Category សកម្មភាព កាលបរិច្ឆេទ និងទីតាំង។";
  if(p.total!==""&&p.women!==""&&Number(p.women)>Number(p.total))return "ចំនួនស្ត្រីមិនអាចច្រើនជាងចំនួនសរុបបានទេ។";
  return "";
}
// The sheet already has a Notes column, so the problem / solution are also written into it (labelled) until separate columns exist.
function notesWith(p){
  var a=[];
  if(p.notes)a.push(p.notes);
  if(p.problem)a.push("⚠️ បញ្ហា៖ "+p.problem);
  if(p.solution)a.push("✅ ដំណោះស្រាយ៖ "+p.solution);
  return a.join("\n");
}
function send(p,draftId,btns){
  var s=cfg&&cfg.staff.filter(function(x){return x.name===p.staff})[0];p.section=s?s.section:"";
  var body=JSON.stringify({staff:p.staff,date:p.date,project:p.project,category:p.category,activity:p.activity,location:p.location,irpg:(p.irpg&&p.irpg!==OTHER?p.irpg:irpgOfVillage(p.location)),total:p.total,women:p.women,notes:notesWith(p),problem:p.problem||"",solution:p.solution||"",org:p.org||"",section:p.section});
  btns.forEach(function(b){b.disabled=true});say("កំពុងបញ្ជូន...");
  fetch(api(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
    .then(function(r){return r.json()}).then(function(d){
      if(!d.ok)throw new Error(d.error);
      say("បានបញ្ជូនចូលផ្ទាំង "+d.tab+" ហើយ ✓","ok");
      if(draftId)delDraft(draftId,true);
      if(draftId&&draftId===editId||!draftId){editId=null;showEdit();clearForm()}
      loadMine();
    }).catch(function(e){say(/failed to fetch|networkerror|load failed/i.test(e.message)?"បញ្ជូនមិនបានទេ៖ មិនអាចភ្ជាប់ទៅ Apps Script (ពិនិត្យអ៊ីនធឺណិត ឬ Deploy)។ ទិន្នន័យនៅរក្សាទុក សូមចុច Save រួចព្យាយាមម្តងទៀត។":"បញ្ជូនមិនបានទេ៖ "+e.message,"err")})
    .then(function(){btns.forEach(function(b){b.disabled=false})});
}
$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var p=formData(),er=validate(p);
  if(er){say(er,"err");return}
  send(p,editId,[$("go"),$("saveDraft")]);
});
function submitDraft(id){
  var d=getDrafts().filter(function(x){return x.id===id})[0];if(!d)return;
  var er=validate(d);
  if(er){loadDraft(id);say("សេចក្ដីព្រាងនេះមិនទាន់ពេញលេញ៖ "+er,"err");return}
  send(d,id,[$("go"),$("saveDraft")]);
}

/* ===== IRPG -> ភូមិ ===== */
var IRPG={
 "IRPG08":["Khes Kroam","Khes Svay","Pong Kriel","Kham Phouk"],
 "IRPG09":["Chantu","Ban Moung","Siem Pang","Samor","Phum Lun","Keng Nhai","Dan Loung"],
 "IRPG10":["Peam Khes","Kanchanh Kouk","Srae Russei","Teteam","O'Chay"],
 "IRPG11":["Pha Bang","La Kay","Nhang Sum"]
};
var OTHER="__other";
function normIrpg(x){var m=/^IRPG0*(\d+)$/i.exec(String(x||"").trim());return m?"IRPG"+("0"+m[1]).slice(-2):String(x||"").trim()}
function irpgOfVillage(v){var k=String(v||"").trim().toLowerCase(),g="";Object.keys(IRPG).forEach(function(i){IRPG[i].forEach(function(n){if(n.toLowerCase()===k)g=i})});return g}
function fillIrpg(){
  $("irpg").innerHTML='<option value="">ជ្រើសរើស IRPG</option>'+Object.keys(IRPG).map(function(k){return '<option>'+esc(k)+'</option>'}).join("")+'<option value="'+OTHER+'">ផ្សេងៗ</option>';
  fillVil();
}
function fillVil(){
  var g=$("irpg").value,l=IRPG[g]||[];
  $("vil").innerHTML='<option value="">ជ្រើសរើសភូមិ</option>'+l.map(function(v){return '<option>'+esc(v)+'</option>'}).join("")+(g?'<option value="'+OTHER+'">ផ្សេងៗ (វាយបញ្ចូល)</option>':'');
  if(g===OTHER){$("vil").innerHTML='<option value="'+OTHER+'">ផ្សេងៗ (វាយបញ្ចូល)</option>';$("vil").value=OTHER}
  showLoc();
}
function showLoc(){$("loc").hidden=$("vil").value!==OTHER}
function getLoc(){return $("vil").value===OTHER?$("loc").value.trim():$("vil").value}
function setLoc(g,loc){
  var guess=g;
  if(!guess||!(IRPG[guess]||[]).length&&guess!==OTHER){guess="";Object.keys(IRPG).forEach(function(k){if(IRPG[k].indexOf(loc)>-1)guess=k})}
  $("irpg").value=guess||(loc?OTHER:"");fillVil();
  if(guess&&guess!==OTHER&&IRPG[guess].indexOf(loc)>-1){$("vil").value=loc;$("loc").value=""}
  else if(loc){$("irpg").value=OTHER;fillVil();$("loc").value=loc}
  else{$("loc").value=""}
  showLoc();
}
$("irpg").onchange=fillVil;
$("vil").onchange=showLoc;

/* ===== Draft (Save ទុកសិន) ===== */
var editId=null;
function getDrafts(){try{return JSON.parse(ls("fl_drafts")||"[]")}catch(e){return[]}}
function putDrafts(a){ls("fl_drafts",JSON.stringify(a))}
function formData(){
  var c=(cfg&&cfg.activities[proj()]||[])[$("cat").value];
  return {staff:$("staff").value,date:$("date").value,project:proj(),category:c?c.category:"",activity:$("act").value,
    location:getLoc(),irpg:$("irpg").value,total:$("tot").value,women:$("wom").value,notes:$("note").value.trim(),
    problem:$("prob").value.trim(),solution:$("sol").value.trim(),org:curOrg()};
}
function showEdit(){
  var b=$("editBar");
  if(editId){b.hidden=false;b.innerHTML='កំពុងកែសេចក្ដីព្រាង · <a href="#" id="cancelEdit">បោះបង់ការកែ</a>';
    $("cancelEdit").onclick=function(e){e.preventDefault();editId=null;showEdit();clearForm();say("")};
    $("saveDraft").textContent="Save ការកែប្រែ"}
  else{b.hidden=true;b.innerHTML="";$("saveDraft").textContent="Save ទុកសិន"}
}
function clearForm(){["loc","tot","wom","note","prob","sol"].forEach(function(i){$(i).value=""});$("irpg").value="";fillVil();$("act").value="";$("date").value=today()}
function renderDrafts(){
  var a=getDrafts(),w=$("draftWrap");
  w.hidden=!a.length;
  $("drafts").innerHTML=a.map(function(d){
    return '<div class="draft"><div class="top"><span>'+esc(d.activity||"(មិនទាន់ជ្រើសសកម្មភាព)")+'</span><span>'+(d.total?esc(d.total)+' នាក់'+(d.women?' (ស្ត្រី '+esc(d.women)+')':''):'')+'</span></div>'+
      '<div class="meta">'+esc(d.staff)+' · '+esc(d.date||"")+' · '+esc(d.project)+' · '+esc(d.location||"")+'</div>'+
      '<div class="act"><button type="button" data-s="'+d.id+'" style="background:var(--btn);color:var(--btnink);border-color:var(--btn)">Submit</button><button type="button" data-e="'+d.id+'">កែ (Edit)</button><button type="button" data-d="'+d.id+'">លុប</button></div></div>'}).join("");
  $("drafts").querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){submitDraft(b.getAttribute("data-s"))}});
  $("drafts").querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){loadDraft(b.getAttribute("data-e"))}});
  $("drafts").querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){delDraft(b.getAttribute("data-d"))}});
}
function delDraft(id,quiet){
  if(!quiet&&!confirm("លុបសេចក្ដីព្រាងនេះ?"))return;
  putDrafts(getDrafts().filter(function(d){return d.id!==id}));
  if(editId===id){editId=null;showEdit()}
  renderDrafts();
}
function loadDraft(id){
  var d=getDrafts().filter(function(x){return x.id===id})[0];if(!d||!cfg)return;
  var s0=cfg.staff.filter(function(x){return x.name===d.staff})[0];
  if(s0&&orgOf(s0)&&orgOf(s0)!==curOrg()){setOrg(orgOf(s0));renderStaff(d.staff)}
  $("staff").value=d.staff;ls("fl_staff",d.staff);
  var s=cfg.staff.filter(function(x){return x.name===d.staff})[0];
  $("secInfo").textContent=s&&s.section?"ផ្នែក៖ "+s.section:"";
  ls("fl_proj","1");
  $(d.project==="CE"?"p2":"p1").checked=true;
  fillCats();
  var cats=cfg.activities[d.project]||[],ci=-1;
  cats.forEach(function(c,i){if(c.category===d.category)ci=i});
  $("cat").value=ci>-1?String(ci):"";fillActs();
  $("act").value=d.activity||"";
  $("date").value=d.date||today();setLoc(d.irpg,d.location||"");
  $("tot").value=d.total||"";$("wom").value=d.women||"";$("note").value=d.notes||"";$("prob").value=d.problem||"";$("sol").value=d.solution||"";
  editId=id;showEdit();loadMine();
  say("បានបើកសេចក្ដីព្រាង។ កែរួចអាច Save ឬ Submit បាន។","ok");
  window.scrollTo({top:0,behavior:"smooth"});
}
$("saveDraft").onclick=function(){
  var p=formData();
  if(!p.staff){say("សូមជ្រើសរើសឈ្មោះបុគ្គលិកមុន Save។","err");return}
  if(p.total!==""&&p.women!==""&&Number(p.women)>Number(p.total)){say("ចំនួនស្ត្រីមិនអាចច្រើនជាងចំនួនសរុបបានទេ។","err");return}
  var a=getDrafts();
  if(editId){
    a=a.map(function(d){if(d.id===editId){p.id=d.id;return p}return d});
  }else{
    p.id="d"+Date.now();a.unshift(p);
  }
  putDrafts(a);
  editId=null;showEdit();clearForm();renderDrafts();
  say("បាន Save ទុកសិនហើយ ✓ (នៅលើឧបករណ៍នេះ)។ អាចកែវិញពីបញ្ជីខាងក្រោម។","ok");
};

var sumData=null;
function showTab(t){
  $("viewLog").hidden=t!=="log";$("viewSum").hidden=t!=="sum";
  $("tLog").classList.toggle("on",t==="log");$("tSum").classList.toggle("on",t==="sum");
  if(t==="sum")loadSum();
}
function loadSum(){
  if(!api()){$("sumOut").innerHTML='<div class="empty">សូមភ្ជាប់ URL របស់ Apps Script ជាមុន។</div>';return}
  $("sumOut").innerHTML='<div class="empty">កំពុងទាញទិន្នន័យ...</div>';
  fetch(api()+"?action=summary&month="+encodeURIComponent($("sm").value)).then(function(r){return r.json()}).then(function(d){
    if(!d.ok)throw new Error(d.error);
    sumData=d;
    d.rows.forEach(function(r){r.irp=normIrpg(r.irpg)||irpgOfVillage(r.village)});
    if($("sm").options.length<=1)$("sm").innerHTML='<option value="">ខែទាំងអស់</option>'+d.months.map(function(m){return '<option>'+esc(m)+'</option>'}).join("");
    var cur=$("ss").value,secs=[];
    d.rows.forEach(function(r){if(r.section&&secs.indexOf(r.section)<0)secs.push(r.section)});
    $("ss").innerHTML='<option value="">ទាំងអស់</option>'+secs.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    $("ss").value=cur;
    var ci=$("si").value,irs=[];
    d.rows.forEach(function(r){if(r.irp&&irs.indexOf(r.irp)<0)irs.push(r.irp)});irs.sort();
    $("si").innerHTML='<option value="">ទាំងអស់</option>'+irs.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    $("si").value=ci;
    fillSumCats();renderSum();
  }).catch(function(e){$("sumOut").innerHTML='<div class="empty">មិនអាចទាញរបាយការណ៍បានទេ៖ '+esc(e.message)+'</div>'});
}
function fillSumCats(){
  var sec=$("ss").value,cur=$("sc").value,cats=[];
  sumData.rows.forEach(function(r){if((!sec||r.section===sec)&&r.category&&cats.indexOf(r.category)<0)cats.push(r.category)});
  $("sc").innerHTML='<option value="">ទាំងអស់</option>'+cats.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
  if(cats.indexOf(cur)>-1)$("sc").value=cur;
  fillSumActs();
}
function fillSumActs(){
  var sec=$("ss").value,cat=$("sc").value,cur=$("sa").value,acts=[];
  sumData.rows.forEach(function(r){if((!sec||r.section===sec)&&(!cat||r.category===cat)&&r.activity&&acts.indexOf(r.activity)<0)acts.push(r.activity)});
  $("sa").innerHTML='<option value="">ទាំងអស់</option>'+acts.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
  if(acts.indexOf(cur)>-1)$("sa").value=cur;
}
function renderSum(){
  var sec=$("ss").value,cat=$("sc").value,act=$("sa").value,irp=$("si").value,NOV="(មិនមានភូមិ)";
  var rows=sumData.rows.filter(function(r){return (!sec||r.section===sec)&&(!cat||r.category===cat)&&(!act||r.activity===act)&&(!irp||r.irp===irp)});
  if(!rows.length){$("sumOut").innerHTML='<div class="empty">មិនទាន់មានទិន្នន័យសម្រាប់ជម្រើសនេះទេ។</div>';return}
  var tree={},T=0,W=0,N=0,allV={};
  rows.forEach(function(r){
    var sn=r.section||"(គ្មាន Section)",cn=r.category||"(គ្មាន Category)";
    var s=tree[sn]=tree[sn]||{t:0,w:0,c:{}};
    var c=s.c[cn]=s.c[cn]||{t:0,w:0,a:{}};
    var a=c.a[r.activity]=c.a[r.activity]||{t:0,w:0,n:0,v:{}};
    var vn=String(r.village||"").trim(),vk=vn.toLowerCase()||NOV;
    var v=a.v[vk]=a.v[vk]||{name:vn||NOV,n:0,t:0,w:0};
    v.n+=r.count;v.t+=r.total;v.w+=r.women;
    a.n+=r.count;a.t+=r.total;a.w+=r.women;
    c.t+=r.total;c.w+=r.women;s.t+=r.total;s.w+=r.women;
    T+=r.total;W+=r.women;N+=r.count;if(vk!==NOV)allV[vk]=1;
  });
  function vc(a){return Object.keys(a.v).filter(function(k){return k!==NOV}).length}
  var h='<div class="grand"><div><b>'+N+'</b><span>ចំនួនដងសកម្មភាព</span></div><div><b>'+Object.keys(allV).length+'</b><span>ចំនួនភូមិ</span></div><div><b>'+T+'</b><span>អ្នកចូលរួមសរុប</span></div><div><b>'+W+'</b><span>ស្ត្រី</span></div></div>';
  if(cat||act||irp){
    var by={};
    rows.forEach(function(r){
      var b=by[r.activity]=by[r.activity]||{n:0,t:0,w:0,v:{}};
      var vn=String(r.village||"").trim().toLowerCase();
      b.n+=r.count;b.t+=r.total;b.w+=r.women;if(vn)b.v[vn]=1;
    });
    var ml=$("sm").value||"ខែទាំងអស់";
    h+='<div class="bd"><h3>'+esc(ml)+(irp?' · '+esc(irp):'')+(cat?' · '+esc(cat):'')+(act?' · '+esc(act):'')+'</h3><div class="tw"><table><tr><th>សកម្មភាព</th><th class="num">ភូមិ</th><th class="num">ចំនួនដង</th><th class="num">អ្នកចូលរួម</th><th class="num">ស្ត្រី</th></tr>';
    Object.keys(by).sort().forEach(function(k){var b=by[k];
      h+='<tr><td>'+esc(k)+'</td><td class="num">'+Object.keys(b.v).length+'</td><td class="num">'+b.n+'</td><td class="num">'+b.t+'</td><td class="num">'+b.w+'</td></tr>'});
    h+='</table></div></div>';
  }
  Object.keys(tree).forEach(function(sn){
    var s=tree[sn];
    h+='<details open><summary><span>'+esc(sn)+'</span><span class="n">សរុប '+s.t+' · ស្ត្រី '+s.w+'</span></summary>';
    Object.keys(s.c).forEach(function(cn){
      var c=s.c[cn];
      h+='<details open><summary><span>'+esc(cn)+'</span><span class="n">សរុប '+c.t+' · ស្ត្រី '+c.w+'</span></summary>';
      Object.keys(c.a).forEach(function(an){
        var a=c.a[an],vs=Object.keys(a.v).map(function(k){return a.v[k]}).sort(function(x,y){return y.t-x.t});
        h+='<details open><summary><span>'+esc(an)+'</span><span class="n">ភូមិ '+vc(a)+' · សរុប '+a.t+' · ស្ត្រី '+a.w+'</span></summary><div class="tw"><table><tr><th>ភូមិ</th><th class="num">ចំនួនដង</th><th class="num">សរុប</th><th class="num">ស្ត្រី</th></tr>';
        vs.forEach(function(v){h+='<tr><td>'+esc(v.name)+'</td><td class="num">'+v.n+'</td><td class="num">'+v.t+'</td><td class="num">'+v.w+'</td></tr>'});
        h+='</table></div></details>';
      });
      h+='</details>';
    });
    h+='</details>';
  });
  $("sumOut").innerHTML=h;
}
$("tLog").onclick=function(){showTab("log")};
$("tSum").onclick=function(){showTab("sum")};
$("sm").onchange=loadSum;
$("ss").onchange=function(){if(sumData){fillSumCats();renderSum()}};
$("sc").onchange=function(){if(sumData){fillSumActs();renderSum()}};
$("sa").onchange=function(){if(sumData)renderSum()};
$("si").onchange=function(){if(sumData)renderSum()};

function themeIcon(){var d=document.documentElement.dataset.theme==="dark";$("theme").textContent=d?"☀️":"🌙";$("theme").title=d?"Light mode":"Dark mode"}
$("theme").onclick=function(){var t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;ls("fl_theme",t);themeIcon()};
themeIcon();
$("date").value=today();
fillIrpg();
loadConfig();
renderDrafts();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
